{
  "name": "Release 28 \u2014 MT300N-V2 IKEv2 client profile",
  "on": {
    "push": {
      "branches": [
        "codex/mt300n-v2-release28"
      ],
      "paths": [
        "release28/**",
        ".github/workflows/release28.yml"
      ]
    },
    "workflow_dispatch": {
      "inputs": {
        "build_image": {
          "description": "Compile the ikev2 sysupgrade image (a push always compiles)",
          "required": false,
          "default": "true"
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "release28-${{ github.ref }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "validate": {
      "name": "Prepare source and IKEv2 regressions",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 30,
      "defaults": {
        "run": {
          "shell": "bash",
          "working-directory": "source28"
        }
      },
      "steps": [
        {
          "name": "Checkout recipe",
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Prepare Release 28 source",
          "run": "python3 release28/prepare.py",
          "working-directory": "."
        },
        {
          "name": "Install validators",
          "run": "sudo apt-get update\nsudo apt-get install -y lua5.1 nftables iproute2 nodejs"
        },
        {
          "name": "Run IKEv2 model and syntax checks",
          "run": "set -euo pipefail\nsh tests/test_ikev2_model.sh\nlua5.1 tests/test_ikev2_remote_ports.lua\nlua5.1 -e 'local M=dofile(\"package/luci-app-mango-ikev2/root/usr/lib/mango-ikev2/model.lua\"); local p={enabled=\"1\",mode=\"split\",server=\"vpn.example.com\",auth=\"eap\",username=\"u\",password=\"p\",cn_cidrs={\"1.0.0.0/24\"}}; local f=assert(io.open(\"/tmp/ikev2.nft\",\"w\")); f:write(M.nft(p)); f:close()'\nsudo nft -c -f /tmp/ikev2.nft\ntest -f config/mt300n-v2-ikev2.config\ngrep -q 'luci-app-mango-ikev2' config/mt300n-v2-ikev2.config\ngrep -q 'CONFIG_PACKAGE_xray-core is not set' config/mt300n-v2-ikev2.config\ngrep -q 'CONFIG_PACKAGE_kmod-crypto-chacha20poly1305=y' config/mt300n-v2-ikev2.config\ngrep -q 'CONFIG_PACKAGE_kmod-crypto-lib-chacha20=y' config/mt300n-v2-ikev2.config\ngrep -q 'CONFIG_PACKAGE_kmod-crypto-lib-poly1305=y' config/mt300n-v2-ikev2.config\npython3 scripts/patch-crypto-chacha.py --selftest\ngrep -q 'esp_proposals = chacha20poly1305,aes128-sha1,aes256-sha1' package/luci-app-mango-ikev2/root/usr/lib/mango-ikev2/model.lua\ntest \"$(cat files/etc/mango-release)\" = 28\npython3 tests/test_ikev2_wan.py\nsh tests/test_ikev2_ca_status.sh\nnode --check package/luci-app-mango-ikev2/htdocs/luci-static/resources/view/mango-ikev2.js\nsh -n package/luci-app-mango-ikev2/root/usr/libexec/mango-ikev2-ca-status package/luci-app-mango-ikev2/root/usr/libexec/mango-ikev2-ca-install package/luci-app-mango-ikev2/root/usr/lib/mango-ikev2/ca-paths.sh package/luci-app-mango-ikev2/root/etc/uci-defaults/95-mango-ikev2\n"
        },
        {
          "name": "Upload prepared source recipe",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "28-ikev2-source-${{ github.run_number }}",
            "path": "source28/RELEASE-28.md\nsource28/SOURCE-DELTA-28.json\nsource28/SOURCE-FILES-SHA256SUMS\nsource28/config/mt300n-v2-ikev2.config\nsource28/package/luci-app-mango-ikev2\nsource28/tests/test_ikev2*",
            "retention-days": 14,
            "if-no-files-found": "error"
          }
        }
      ]
    },
    "build_ikev2": {
      "name": "Compile IKEv2 sysupgrade image",
      "if": "github.event_name == 'push' || github.event.inputs.build_image == 'true'",
      "needs": [
        "validate"
      ],
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 330,
      "defaults": {
        "run": {
          "shell": "bash",
          "working-directory": "source28"
        }
      },
      "env": {
        "MANGO_BUILD_PROFILE": "ikev2",
        "MANGO_KERNEL_PROFILE": "production"
      },
      "steps": [
        {
          "name": "Checkout recipe",
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Prepare Release 28 source",
          "run": "python3 release28/prepare.py",
          "working-directory": "."
        },
        {
          "name": "Install build dependencies",
          "run": "sudo apt-get update\nsudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev libelf-dev python3 python3-setuptools python3-pyelftools rsync swig unzip zlib1g-dev file wget curl zstd xz-utils bzip2 ccache xsltproc lua5.1 nftables qemu-user-static"
        },
        {
          "name": "Prepare OpenWrt tree and production kernel",
          "run": "set -euo pipefail\nbash scripts/prepare.sh 2>&1 | tee prepare-ikev2.log\npython3 scripts/kernel-profile.py configure --tree openwrt --profile \"$MANGO_KERNEL_PROFILE\"\nmake -C openwrt defconfig 2>&1 | tee diagnostic-defconfig.log\npython3 scripts/build-profile.py ikev2 --verify\ngrep -qx 'CONFIG_TARGET_SQUASHFS_BLOCK_SIZE=1024' openwrt/.config\n! grep -qx 'CONFIG_PACKAGE_dnsmasq=y' openwrt/.config\n! grep -qx 'CONFIG_PACKAGE_xray-core=y' openwrt/.config\ncp openwrt/.config reports/resolved.config\n(cd openwrt && ./scripts/diffconfig.sh) > reports/diffconfig.txt\n"
        },
        {
          "name": "Download and compile",
          "working-directory": "source28/openwrt",
          "run": "set -euo pipefail\nmake download -j4 2>&1 | tee ../download-ikev2.log\njobs=$(nproc)\n[ \"$jobs\" -le 4 ] || jobs=4\nmem=$(awk '/MemTotal/ {print $2}' /proc/meminfo)\nif [ \"$mem\" -lt 12000000 ] && [ \"$jobs\" -gt 2 ]; then jobs=2; fi\necho \"Build jobs: $jobs; RAM KiB: $mem\"\nmake -j\"$jobs\" V=s 2>&1 | tee ../build-ikev2.log\n"
        },
        {
          "name": "Check image size, kernel profile and SquashFS",
          "run": "python3 - <<'PY'\nimport hashlib, json, re, struct\nfrom pathlib import Path\ntext = Path('openwrt/target/linux/ramips/image/mt76x8.mk').read_text()\nblock = re.search(r'define Device/glinet_gl-mt300n-v2\\n(.*?)\\nendef', text, re.S)\nassert block, 'device block missing'\nsize_match = re.search(r'IMAGE_SIZE\\s*:=\\s*(\\d+)k', block.group(1))\nassert size_match, 'IMAGE_SIZE missing'\nlimit = int(size_match.group(1)) * 1024\nimages = list(Path('openwrt/bin/targets/ramips/mt76x8').glob('*glinet_gl-mt300n-v2*squashfs-sysupgrade.bin'))\nassert len(images) == 1, images\ndata = images[0].read_bytes()\nsize = len(data)\nmargin = limit - size\nreport = {\n    'image': images[0].name,\n    'image_bytes': size,\n    'image_limit_bytes': limit,\n    'margin_bytes': margin,\n    'sha256': hashlib.sha256(data).hexdigest(),\n}\nprint(report)\nassert margin >= 1024 * 1024, margin\nmatches = []\nstart = 0\nwhile True:\n    o = data.find(b'hsqs', start)\n    if o < 0:\n        break\n    start = o + 4\n    if o + 96 <= len(data) and struct.unpack_from('<HH', data, o + 28) == (4, 0):\n        matches.append((o, struct.unpack_from('<I', data, o + 12)[0], struct.unpack_from('<H', data, o + 20)[0]))\nassert len(matches) == 1, matches\nassert matches[0][1:] == (1048576, 4), matches\nroots = list(Path('openwrt/build_dir').glob('target-*/root-ramips'))\nassert len(roots) == 1, roots\nroot = roots[0]\nassert (root / 'etc/mango-release').read_text().strip() == '28'\nassert (root / 'etc/mango-kernel-profile').read_text().strip() == 'production'\ndef crypto_present(root, names):\n    modules = []\n    for name in names:\n        modules.extend(sorted(root.glob('lib/modules/**/' + name + '.ko')))\n    builtin = []\n    needles = {name + '.ko' for name in names}\n    for builtin_file in root.glob('lib/modules/**/modules.builtin'):\n        basenames = {Path(line.strip()).name for line in builtin_file.read_text().splitlines()}\n        hits = sorted(needles & basenames)\n        if hits:\n            builtin.append({'file': str(builtin_file.relative_to(root)), 'hits': hits})\n    autodirs = list(root.glob('etc/modules.d/*')) + list(root.glob('etc/modules-boot.d/*'))\n    tokens = set()\n    for auto in autodirs:\n        tokens.update(auto.read_text().split())\n    autoloaded = [p.stem for p in modules if p.stem in tokens]\n    return modules, builtin, autoloaded\n\nmods, builtin, autoloaded = crypto_present(root, ['chacha20poly1305'])\nassert mods or builtin, 'chacha20poly1305 AEAD template missing from firmware root'\nif mods:\n    assert autoloaded, 'chacha20poly1305.ko is in the image but has no modules.d autoload entry'\nreport['chacha20poly1305'] = [str(p.relative_to(root)) for p in mods] or builtin\nreport['chacha20poly1305_autoload'] = autoloaded\n\nmods, builtin, autoloaded = crypto_present(root, ['chacha_generic', 'chacha-mips', 'chacha'])\nassert mods or builtin, 'chacha20 algorithm module missing (need chacha_generic.ko, chacha-mips.ko, or built-in)'\nif mods:\n    assert autoloaded, 'chacha20 algorithm module is in the image but has no modules.d autoload entry'\nreport['chacha20'] = [str(p.relative_to(root)) for p in mods] or builtin\nreport['chacha20_autoload'] = autoloaded\n\nmods, builtin, autoloaded = crypto_present(root, ['poly1305_generic', 'poly1305-mips', 'poly1305'])\nassert mods or builtin, 'poly1305 algorithm module missing (need poly1305_generic.ko, poly1305-mips.ko, or built-in)'\nif mods:\n    assert autoloaded, 'poly1305 algorithm module is in the image but has no modules.d autoload entry'\nreport['poly1305'] = [str(p.relative_to(root)) for p in mods] or builtin\nreport['poly1305_autoload'] = autoloaded\nassert (root / 'usr/lib/mango-ikev2/model.lua').is_file()\nassert not (root / 'usr/bin/xray').exists()\nreport['superblock'] = matches\nreport['version'] = '28'\n# Compare every release overlay rootfs file with the final staged firmware root.\npackage_root = Path('package/luci-app-mango-ikev2/root')\nexpected = set()\nfor release in ('release27', 'release28'):\n    overlay = Path('..') / release / 'overlay' / package_root\n    expected.update(p.relative_to(overlay) for p in overlay.rglob('*') if p.is_file())\npackaged = {}\nfor relative in sorted(expected):\n    source = package_root / relative\n    installed = root / relative\n    assert installed.is_file(), str(relative)\n    assert installed.read_bytes() == source.read_bytes(), str(relative)\n    if source.read_bytes().startswith(b'#!'):\n        assert installed.stat().st_mode & 0o111, str(relative)\n    packaged[str(relative)] = hashlib.sha256(installed.read_bytes()).hexdigest()\nview = 'www/luci-static/resources/view/mango-ikev2.js'\nview_data = (root / view).read_bytes()\nfor field in ('remote_port', 'remote_port2', 'remote_port3'):\n    assert re.search(rb\"['\\\"]\" + field.encode() + rb\"['\\\"]\", view_data), field\npackaged[view] = hashlib.sha256(view_data).hexdigest()\nreport['packaged_fixes_sha256'] = packaged\nreport['base_commit'] = '934c0a7f6918d455b959bd2066c0261d59d82c1b'\nreport['hardware_acceptance'] = 'pending'\nreport['profile'] = 'ikev2'\nreport['kernel_profile'] = 'production'\nPath('reports/firmware-format.json').write_text(json.dumps(report, indent=2) + '\\n')\nPY\n\n(cd openwrt/bin/targets/ramips/mt76x8 && sha256sum *glinet_gl-mt300n-v2*squashfs-sysupgrade.bin > SHA256SUMS)\n"
        },
        {
          "name": "Upload IKEv2 image",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "28-ikev2-image-${{ github.run_number }}",
            "path": "source28/openwrt/bin/targets/ramips/mt76x8/*sysupgrade.bin\nsource28/prepare-ikev2.log\nsource28/download-ikev2.log\nsource28/build-ikev2.log\nsource28/diagnostic-defconfig.log\nsource28/reports/\nsource28/openwrt/bin/targets/ramips/mt76x8/SHA256SUMS\nsource28/RELEASE-28.md\nsource28/SOURCE-DELTA-28.json",
            "retention-days": 14,
            "if-no-files-found": "warn"
          },
          "if": "always()"
        }
      ]
    }
  }
}
