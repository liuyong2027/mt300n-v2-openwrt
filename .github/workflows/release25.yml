{
  "name": "Release 25 — MT300N-V2 IKEv2 client profile",
  "on": {
    "push": {
      "branches": [
        "cursor/ikev2-client-split-8c23",
        "codex/mt300n-v2-release25"
      ],
      "paths": [
        "release25/**",
        ".github/workflows/release25.yml"
      ]
    },
    "workflow_dispatch": {
      "inputs": {
        "build_image": {
          "description": "Also compile the ikev2 sysupgrade image",
          "required": false,
          "default": "false"
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "release25-${{ github.ref }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "validate": {
      "name": "Prepare source and IKEv2 regressions",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 30,
      "defaults": {
        "run": {
          "shell": "bash",
          "working-directory": "source25"
        }
      },
      "steps": [
        {
          "name": "Checkout recipe",
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Prepare Release 25 source",
          "run": "python3 release25/prepare.py",
          "working-directory": "."
        },
        {
          "name": "Install validators",
          "run": "sudo apt-get update\nsudo apt-get install -y lua5.1 nftables iproute2 nodejs"
        },
        {
          "name": "Run IKEv2 model and syntax checks",
          "run": "sh tests/test_ikev2_model.sh\nlua5.1 -e 'local M=dofile(\"package/luci-app-mango-ikev2/root/usr/lib/mango-ikev2/model.lua\"); local p={enabled=\"1\",mode=\"split\",server=\"vpn.example.com\",auth=\"eap\",username=\"u\",password=\"p\",cn_cidrs={\"1.0.0.0/24\"}}; io.open(\"/tmp/ikev2.nft\",\"w\"):write(M.nft(p)):close()'\nnft -c -f /tmp/ikev2.nft\ntest -f config/mt300n-v2-ikev2.config\ngrep -q 'luci-app-mango-ikev2' config/mt300n-v2-ikev2.config\ngrep -q 'CONFIG_PACKAGE_xray-core is not set' config/mt300n-v2-ikev2.config\ntest \"$(cat files/etc/mango-release)\" = 25"
        },
        {
          "name": "Upload prepared source recipe",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "25-ikev2-source-${{ github.run_number }}",
            "path": "source25/RELEASE-25.md\nsource25/VALIDATION-25.json\nsource25/SOURCE-DELTA-25.json\nsource25/config/mt300n-v2-ikev2.config\nsource25/package/luci-app-mango-ikev2\nsource25/tests/test_ikev2_model.*",
            "retention-days": 14,
            "if-no-files-found": "error"
          }
        }
      ]
    },
    "build_ikev2": {
      "name": "Optional IKEv2 image compile",
      "if": "github.event_name == 'workflow_dispatch' && github.event.inputs.build_image == 'true'",
      "needs": ["validate"],
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 330,
      "defaults": {
        "run": {
          "shell": "bash",
          "working-directory": "source25"
        }
      },
      "env": {
        "MANGO_BUILD_PROFILE": "ikev2",
        "MANGO_KERNEL_PROFILE": "production"
      },
      "steps": [
        {
          "name": "Checkout recipe",
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Prepare Release 25 source",
          "run": "python3 release25/prepare.py",
          "working-directory": "."
        },
        {
          "name": "Install build dependencies",
          "run": "sudo apt-get update\nsudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev libelf-dev python3 python3-setuptools python3-pyelftools rsync swig unzip zlib1g-dev file wget curl zstd xz-utils bzip2 ccache xsltproc lua5.1 nftables qemu-user-static"
        },
        {
          "name": "Prepare OpenWrt tree for IKEv2 profile",
          "run": "bash scripts/prepare.sh 2>&1 | tee prepare-ikev2.log"
        },
        {
          "name": "Download and compile",
          "working-directory": "source25/openwrt",
          "run": "make download -j4 2>&1 | tee ../download-ikev2.log\njobs=$(nproc); [ \"$jobs\" -le 4 ] || jobs=4\nmake -j\"$jobs\" V=s 2>&1 | tee ../build-ikev2.log"
        },
        {
          "name": "Check image margin",
          "run": "python3 - <<'PY'\nfrom pathlib import Path\nimages=list(Path('openwrt/bin/targets/ramips/mt76x8').glob('*sysupgrade.bin'))\nassert len(images)==1, images\nsize=images[0].stat().st_size\n# Approximate usable firmware budget on GL-MT300N-V2; keep >=1 MiB free.\nlimit=16*1024*1024 - 512*1024\nmargin=limit-size\nprint({'image_bytes': size, 'margin_bytes': margin})\nassert margin >= 1024*1024, margin\nroots=list(Path('openwrt/build_dir').glob('target-*/root-ramips'))\nassert len(roots)==1\nassert (roots[0]/'etc/mango-release').read_text().strip()=='25'\nassert (roots[0]/'usr/lib/mango-ikev2/model.lua').is_file()\nassert not (roots[0]/'usr/bin/xray').exists()\nPY"
        },
        {
          "name": "Upload IKEv2 image",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "25-ikev2-image-${{ github.run_number }}",
            "path": "source25/openwrt/bin/targets/ramips/mt76x8/*sysupgrade.bin\nsource25/prepare-ikev2.log\nsource25/build-ikev2.log\nsource25/reports/",
            "retention-days": 14,
            "if-no-files-found": "warn"
          }
        }
      ]
    }
  }
}
