{
  "name": "MT300N-V2 capacity probe",
  "on": {
    "push": {
      "branches": [
        "main"
      ],
      "paths": [
        "mt300n-v2-round2.zip"
      ]
    },
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "mt300n-v2-capacity",
    "cancel-in-progress": false
  },
  "jobs": {
    "build": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 330,
      "defaults": {
        "run": {
          "shell": "bash"
        }
      },
      "steps": [
        {
          "name": "Checkout build recipe",
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Extract reviewed build source bundle",
          "run": "python3 -m zipfile -e mt300n-v2-round2.zip ."
        },
        {
          "name": "Validate recipe",
          "run": "python3 -m unittest discover -s tests -v\nbash -n scripts/prepare.sh scripts/validate-runtime.sh\nfor f in package/luci-app-mango-proxy/root/usr/libexec/mango-fw package/luci-app-mango-proxy/root/etc/init.d/mango_proxy package/luci-app-mango-proxy/root/etc/uci-defaults/95-mango-proxy; do sh -n \"$f\"; done\nnode --check package/luci-app-mango-proxy/htdocs/luci-static/resources/view/mango-proxy.js"
        },
        {
          "name": "Install build dependencies",
          "run": "sudo apt-get update\nsudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev libelf-dev python3 python3-setuptools python3-pyelftools rsync swig unzip zlib1g-dev file wget curl zstd xz-utils bzip2 ccache xsltproc lua5.1 nftables qemu-user-static\nmkdir -p reports\ndf -h . | tee reports/disk-before.txt"
        },
        {
          "name": "Validate routing policy and nftables",
          "run": "bash scripts/validate-runtime.sh 2>&1 | tee policy-tests.log"
        },
        {
          "name": "Prepare pinned sources and configuration",
          "run": "bash scripts/prepare.sh 2>&1 | tee prepare.log"
        },
        {
          "name": "Download selected sources",
          "working-directory": "openwrt",
          "run": "make download -j4 2>&1 | tee ../download.log"
        },
        {
          "name": "Build round 2 image",
          "id": "compile",
          "continue-on-error": true,
          "working-directory": "openwrt",
          "run": "make -j2 V=s 2>&1 | tee ../build.log"
        },
        {
          "name": "Validate actual MIPS Xray configuration",
          "id": "runtime",
          "if": "steps.compile.outcome == 'success'",
          "run": "bash scripts/validate-runtime.sh mips 2>&1 | tee runtime-tests.log"
        },
        {
          "name": "Report capacity",
          "if": "always()",
          "env": {
            "BUILD_OUTCOME": "${{ steps.compile.outcome }}"
          },
          "run": "python3 scripts/report.py"
        },
        {
          "name": "Upload diagnostics only",
          "if": "always()",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "capacity-report-${{ github.run_number }}",
            "path": "reports/\nprepare.log\ndownload.log\nbuild.log\npolicy-tests.log\nruntime-tests.log",
            "retention-days": 7,
            "if-no-files-found": "warn",
            "include-hidden-files": true
          }
        }
      ]
    }
  }
}
