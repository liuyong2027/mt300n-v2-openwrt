{
  "name": "Cudy TR3600 V1.0 - 1.1.1 stable release",
  "on": {
    "push": {
      "branches": [
        "codex/tr3600-webfiles-1.1.1"
      ],
      "paths": [
        "tr3600/**",
        ".github/workflows/tr3600-webfiles-1.1.1.yml",
        "release/tr3600-1.1.1/**"
      ]
    },
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "concurrency": {
    "group": "tr3600-webfiles-1.1.1-${{ github.ref }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "build": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 330,
      "defaults": {
        "run": {
          "shell": "bash"
        }
      },
      "env": {
        "MANGO_BUILD_PROFILE": "standard"
      },
      "steps": [
        {
          "name": "Checkout build recipe",
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Fetch checked boot-readiness regression evidence",
          "uses": "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093",
          "with": {
            "name": "tr3600-1.1.1-boot-regressions",
            "path": "reports/boot-readiness-regression"
          }
        },
        {
          "name": "Preserve and require46 ARM64 boot regression tests",
          "run": "mkdir -p reports\ncp reports/boot-readiness-regression/bootfix-arm64-tests.txt reports/webfiles-boot-regressions.txt\ngrep -Fx 'PASS' reports/webfiles-boot-regressions.txt"
        },
        {
          "name": "Extract reviewed build source bundle",
          "run": "python3 - <<'PY'\nimport base64, hashlib, io, zipfile\nfrom pathlib import Path, PurePosixPath\ndata=base64.b64decode(Path('release20-test-failover1-source.zip.b64').read_text().strip(),validate=True)\nassert hashlib.sha256(data).hexdigest()=='8dc17ef842929725b10a0152569a690c7ffe148473b1005cd7d610cda510e787'\nwith zipfile.ZipFile(io.BytesIO(data)) as z:\n    assert z.testzip() is None\n    names=z.namelist()\n    assert len(names)==len(set(names))\n    for name in names:\n        p=PurePosixPath(name)\n        assert not p.is_absolute() and '..' not in p.parts and chr(92) not in name\n    listed=[]\n    for row in z.read('SOURCE-FILES-SHA256SUMS').decode().splitlines():\n        expected,name=row.split('  ',1)\n        assert hashlib.sha256(z.read(name)).hexdigest()==expected,name\n        listed.append(name)\n    assert set(listed)==set(names)-{'SOURCE-FILES-SHA256SUMS'}\n    z.extractall()\nassert Path('files/etc/mango-release').read_text().strip()=='20-test-failover1'\nPY"
        },
        {
          "name": "Set up pinned Go compiler",
          "uses": "actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16",
          "with": {
            "go-version": "1.27.2",
            "cache": false
          }
        },
        {
          "name": "Set up pinned frontend Node runtime",
          "uses": "actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38",
          "with": {
            "node-version": "24.19.0"
          }
        },
        {
          "name": "Checkout exact Quantum source",
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "repository": "gtsteffaniak/filebrowser",
            "ref": "a29573e7068a4a682f199b64bec3e206159f535c",
            "path": "vendor/quantum",
            "persist-credentials": false
          }
        },
        {
          "name": "Install build dependencies",
          "run": "sudo apt-get update\nsudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev libelf-dev python3 python3-setuptools python3-pyelftools rsync swig unzip zlib1g-dev file wget curl zstd xz-utils bzip2 ccache xsltproc lua5.1 nftables iproute2 iputils-ping qemu-user-static samba samba-vfs-modules smbclient\nmkdir -p reports\ndf -h . | tee reports/disk-before.txt"
        },
        {
          "name": "Validate consent defaults and encrypted-settings upgrade keep list",
          "run": "python3 tr3600/webfiles/test_integration.py\npython3 tr3600/test-feature-retirement.py\nnode --check tr3600/luci-app-cudy-webfiles/htdocs/luci-static/resources/view/cudy-webfiles.js\npython3 release/tr3600-1.1.1/test_asset_names.py\n"
        },
        {
          "name": "Validate ZeroTier direct-path policy, ownership and real nft lifecycle",
          "run": "lua5.1 tr3600/test-zt-direct.lua\npython3 tr3600/test-zt-integration.py\nluac5.1 -p tr3600/network-root/usr/libexec/cudy-zt-direct-run\nsudo unshare --net sh tr3600/test-zt-direct-nft.sh\npython3 tr3600/test-zt-firewall-defaults.py\n"
        },
        {
          "name": "Build guarded WebFiles and patched Quantum from pinned sources",
          "run": "python3 tr3600/webfiles/build.py\npython3 tr3600/webfiles/test_binary_guard.py tr3600/cudy-webfiles/build-output/cudy-webfiles tr3600/cudy-webfiles/build-output/filebrowser --report reports/webfiles-arm64-binary-guard.json\n"
        },
        {
          "name": "Validate USB disk consent, lifecycle, LuCI and Samba integration",
          "run": "set -Eeuo pipefail\nlua5.1 tr3600/test-usb.lua\npython3 tr3600/test-usb-integration.py\nnode --check tr3600/luci-app-cudy-usb/htdocs/luci-static/resources/view/cudy-usb.js\nnode tr3600/test-usb-ui.cjs\nnode tr3600/test-menu-tabs.cjs\nluac5.1 -p tr3600/luci-app-cudy-usb/root/usr/libexec/cudy-usb-main\nluac5.1 -p tr3600/luci-app-cudy-usb/root/usr/lib/lua/cudy/usb-runtime.lua\nsh -n tr3600/luci-app-cudy-usb/root/usr/libexec/cudy-usb tr3600/luci-app-cudy-usb/root/etc/init.d/cudy_usb tr3600/luci-app-cudy-usb/root/etc/uci-defaults/94-cudy-usb tr3600/luci-app-cudy-usb/root/etc/hotplug.d/block/99-cudy-usb\n"
        },
        {
          "name": "Validate status LEDs, Wi-Fi unification, network defaults and feature retirement",
          "run": "lua5.1 tr3600/test-led.lua\nlua5.1 tr3600/test-led-runtime.lua\nnode --check tr3600/luci-app-cudy-led/htdocs/luci-static/resources/view/cudy-led.js\nnode tr3600/test-led-ui.cjs\nluac5.1 -p tr3600/luci-app-cudy-led/root/usr/libexec/cudy-led-control\nfor path in tr3600/luci-app-cudy-led/root/usr/libexec/cudy-led-apply tr3600/luci-app-cudy-led/root/usr/libexec/cudy-led-run tr3600/luci-app-cudy-led/root/usr/libexec/cudy-led-upgrade tr3600/luci-app-cudy-led/root/etc/init.d/cudy_led tr3600/luci-app-cudy-led/root/etc/uci-defaults/92-cudy-led tr3600/luci-app-cudy-led/root/etc/hotplug.d/ntp/95-cudy-led; do sh -n \"$path\"; done\npython3 tr3600/test-led-integration.py\nsh tr3600/test-led-probe.sh\nsh tr3600/test-led-lifecycle.sh\npython3 scripts/audit-installed-content.py tr3600/luci-app-cudy-led/root\nlua5.1 tr3600/test-wifi.lua\nnode --check tr3600/luci-app-cudy-wifi/htdocs/luci-static/resources/view/cudy-wifi.js\nnode tr3600/test-wifi-ui.cjs\nluac5.1 -p tr3600/luci-app-cudy-wifi/root/usr/libexec/cudy-wifi-config\nsh -n tr3600/luci-app-cudy-wifi/root/usr/libexec/cudy-wifi-apply tr3600/luci-app-cudy-wifi/root/etc/init.d/cudy_wifi tr3600/luci-app-cudy-wifi/root/etc/uci-defaults/93-cudy-wifi\nsh tr3600/test-network.sh\npython3 tr3600/test-feature-retirement.py\npython3 tr3600/test-network-defaults.py\n"
        },
        {
          "name": "Validate SS source, settings, LuCI and real nft transition guards",
          "run": "set -Eeuo pipefail\nmodule=tr3600/luci-app-cudy-ss/root/usr/lib/mango/ss-zt.lua\nlua5.1 tr3600/test-ss.lua \"$module\"\nlua5.1 tr3600/test-ss-settings.lua \"$module\"\nlua5.1 tr3600/test-ss-setup.lua \"$module\"\nlua5.1 tr3600/test-ss-transaction.lua tr3600/luci-app-cudy-ss/root/usr/lib/mango/ss-transaction.lua\npython3 tr3600/test-ss-integration.py\nnode --check tr3600/luci-app-cudy-ss/htdocs/luci-static/resources/view/cudy-ss.js\nnode tr3600/test-ss-ui.cjs\nsudo unshare --net sh tr3600/test-ss-nft.sh\n"
        },
        {
          "name": "Validate recipe",
          "run": "python3 -m unittest discover -s tests -v\nsh tests/test_switch_perf.sh .\nsh tests/test_probe_logging.sh .\nsh tests/test_watchdog_startup.sh .\nnode tests/test-ui.cjs\nnode tests/test-site-ui.cjs\nnode tests/subscription.cjs\nnode tests/test-update-progress.cjs\nbash -n scripts/prepare.sh scripts/validate-runtime.sh\nfor f in package/luci-app-mango-proxy/root/usr/libexec/mango-* package/luci-app-mango-proxy/root/usr/libexec/rpcd/mango package/luci-app-mango-proxy/root/etc/init.d/mango_* package/luci-app-mango-proxy/root/etc/uci-defaults/9*-mango-*; do if head -n1 \"$f\" | grep -q lua; then continue; fi; sh -n \"$f\"; done\nnode --check package/luci-app-mango-proxy/htdocs/luci-static/resources/view/mango-proxy.js\nnode --check package/luci-app-mango-proxy/htdocs/luci-static/resources/mango/subscription.js\nsh tests/test_cache_refresh.sh .\nsh tests/test_fw_reuse.sh package/luci-app-mango-proxy/root/etc/init.d/mango_proxy\nsh tests/test_recovery_trace.sh package/luci-app-mango-proxy/root/etc/init.d/mango_proxy package/luci-app-mango-proxy/root/usr/libexec/mango-failover\nsh tests/test_fw_installed.sh package/luci-app-mango-proxy/root/usr/libexec/mango-fw\nsh tests/test_recovery_policy.sh .\nsh tests/test_uplink.sh .\nsh tests/test_runtime_id.sh .\nsh tests/test_start_failure.sh .\npython3 scripts/loading-diagnostic/test-diagnostic.py\nsh tests/test_lifecycle_budget.sh .\nsh tests/test_apply_rollback.sh .\nsh tests/test_process_wait.sh package/luci-app-mango-proxy/root/usr/libexec/mango-process\nsh tests/test_preflight_phases.sh .\nsh tests/test_preflight_reuse.sh .\npython3 scripts/audit-installed-content.py files\npython3 scripts/audit-installed-content.py package/luci-app-mango-proxy/root"
        },
        {
          "name": "Adapt verified source for TR3600 v1",
          "run": "python3 tr3600/port.py\nbash -n tr3600/cudy-upgrade.sh\nbash tr3600/test-upgrade.sh"
        },
        {
          "name": "Validate routing policy and nftables",
          "run": "bash scripts/validate-runtime.sh 2>&1 | tee policy-tests.log"
        },
        {
          "name": "Prepare locked OpenWrt sources with TR3600 support",
          "run": "bash scripts/prepare.sh 2>&1 | tee prepare.log\npython3 tr3600/check-required.py"
        },
        {
          "name": "Download selected sources",
          "working-directory": "openwrt",
          "run": "make download -j4 2>&1 | tee ../download.log"
        },
        {
          "name": "Compile Cudy TR3600 v1 1.1.1 firmware",
          "run": "make -j2 V=s 2>&1 | tee ../build.log",
          "id": "compile",
          "working-directory": "openwrt"
        },
        {
          "name": "Validate actual ARM64 Xray configuration",
          "run": "set -Eeuo pipefail\nbash scripts/validate-runtime.sh arm64 2>&1 | tee runtime-tests.log"
        },
        {
          "name": "Check actual ARM64 BusyBox syntax and installed content",
          "run": "set -Eeuo pipefail\nexec > >(tee reports/arm64-content-check.log) 2>&1\nset -x\nroots=(openwrt/build_dir/target-*/root-mediatek)\ntest \"${#roots[@]}\" = 1\nroot=\"$(realpath \"${roots[0]}\")\"\nfor path in usr/libexec/mango-recovery-guard etc/init.d/mango_proxy lib/upgrade/cudy-tr3600.sh etc/uci-defaults/91-cudy-retire-services etc/hotplug.d/iface/95-cudy-tr3600-eee etc/init.d/cudy_wifi etc/uci-defaults/93-cudy-wifi usr/libexec/cudy-wifi-apply usr/libexec/mango-probe sbin/sysupgrade usr/libexec/cudy-led-apply usr/libexec/cudy-led-run usr/libexec/cudy-led-upgrade etc/init.d/cudy_led etc/uci-defaults/92-cudy-led etc/hotplug.d/ntp/95-cudy-led; do\n  qemu-aarch64-static -L \"$root\" \"$root/bin/busybox\" sh -n \"$root/$path\"\ndone\npython3 tr3600/check-removed.py \"$root\" openwrt/.config\nCUDY_TEST_ROOT=\"$root\" python3 tr3600/test-feature-retirement.py\npython3 scripts/audit-installed-content.py \"$root\" > reports/installed-content-audit.json\nqemu-aarch64-static -L \"$root\" \"$root/usr/bin/lua\" tr3600/test-wifi.lua \"$root/usr/lib/lua/cudy/wifi.lua\"\nCUDY_TEST_ROOT=\"$root\" qemu-aarch64-static -L \"$root\" \"$root/usr/bin/lua\" -e 'assert(loadfile(os.getenv(\"CUDY_TEST_ROOT\")..\"/usr/libexec/cudy-wifi-config\"))'\ncat > reports/cudy-test-lua <<'SH'\n#!/bin/sh\nexec qemu-aarch64-static -L \"$CUDY_TEST_ROOT\" \"$CUDY_TEST_ROOT/usr/bin/lua\" \"$@\"\nSH\nchmod +x reports/cudy-test-lua\nCUDY_TEST_ROOT=\"$root\" LUA_CPATH=\"$root/usr/lib/lua/?.so\" CUDY_TEST_LUA=\"$PWD/reports/cudy-test-lua\" sh tr3600/test-wifi-real-uci.sh tr3600/test-wifi-real-uci.lua \"$root/usr/lib/lua/cudy/wifi.lua\"\nqemu-aarch64-static -L \"$root\" \"$root/usr/libexec/timeout-coreutils\" 2 /bin/true\nset +e\nqemu-aarch64-static -L \"$root\" \"$root/usr/libexec/timeout-coreutils\" 1 /bin/sleep 5\ncudy_timeout_result=$?\nset -e\ntest \"$cudy_timeout_result\" = 124\nqemu-aarch64-static -L \"$root\" \"$root/usr/bin/lua\" tr3600/test-led.lua \"$root/usr/lib/lua/cudy/led.lua\"\nqemu-aarch64-static -L \"$root\" \"$root/usr/bin/lua\" tr3600/test-led-runtime.lua \"$root/usr/lib/lua/cudy/led.lua\" \"$root/usr/lib/lua/cudy/led-runtime.lua\"\nCUDY_TEST_ROOT=\"$root\" qemu-aarch64-static -L \"$root\" \"$root/usr/bin/lua\" -e 'assert(loadfile(os.getenv(\"CUDY_TEST_ROOT\")..\"/usr/libexec/cudy-led-control\"))'\nCUDY_TEST_ROOT=\"$root\" LUA_CPATH=\"$root/usr/lib/lua/?.so\" LUA_PATH=\"$root/usr/lib/lua/?.lua;$root/usr/lib/lua/?/init.lua\" qemu-aarch64-static -L \"$root\" \"$root/usr/bin/lua\" -e 'local j=require(\"luci.jsonc\"); require(\"nixio.fs\"); require(\"uci\"); local r=require(\"cudy.led-runtime\"); assert(j.parse(j.stringify({result=true})).result); local c=assert(require(\"cudy.led\").config()); assert(c.mode==\"status\")'\n\nset -Eeuo pipefail\nCUDY_PERMISSION_TEST_DIR=\"$(mktemp -d /tmp/cudy-permissions-XXXXXX)\"\nexport CUDY_PERMISSION_TEST_DIR CUDY_TEST_ROOT=\"$root\" CUDY_PERMISSION_SOURCE=\"$PWD/tr3600\"\nexport LUA_CPATH=\"$root/usr/lib/lua/?.so\" LUA_PATH=\"$root/usr/lib/lua/?.lua;$root/usr/lib/lua/?/init.lua\"\nqemu-aarch64-static -L \"$root\" \"$root/usr/bin/lua\" tr3600/test-real-nixio.lua\ntest \"$(stat -c %a \"$CUDY_PERMISSION_TEST_DIR/led\")\" = 700\ntest \"$(stat -c %a \"$CUDY_PERMISSION_TEST_DIR/led/sample.json\")\" = 600\ntest \"$(stat -c %a \"$CUDY_PERMISSION_TEST_DIR/wifi.json\")\" = 600\necho 'PASS actual ARM64 private directory/file permissions 700/600/600'\n\nfor path in usr/libexec/cudy-usb etc/init.d/cudy_usb etc/uci-defaults/94-cudy-usb etc/hotplug.d/block/99-cudy-usb; do\n  qemu-aarch64-static -L \"$root\" \"$root/bin/busybox\" sh -n \"$root/$path\"\ndone\nqemu-aarch64-static -L \"$root\" \"$root/usr/bin/lua\" tr3600/test-usb.lua \"$root/usr/lib/lua/cudy/usb.lua\"\nexport CUDY_USB_TEST_DIR=\"$(mktemp -d /tmp/cudy-usb-test-XXXXXX)\" CUDY_USB_SOURCE=\"$PWD/tr3600\"\nqemu-aarch64-static -L \"$root\" \"$root/usr/bin/lua\" tr3600/test-usb-real.lua\n\nbash tr3600/test-ss-ci.sh \"$root\"\n\nqemu-aarch64-static \"$root/usr/lib/cudy-webfiles/bin/cudy-webfiles\" version > reports/webfiles-arm64-version.txt\nqemu-aarch64-static \"$root/usr/lib/cudy-webfiles/bin/cudy-webfiles\" verify-binary \"$root/usr/lib/cudy-webfiles/bin/filebrowser\"\nqemu-aarch64-static \"$root/usr/lib/cudy-webfiles/bin/filebrowser\" --help > reports/quantum-arm64-help.txt\nfor path in etc/init.d/cudy-webfiles etc/uci-defaults/98-cudy-webfiles usr/libexec/rpcd/cudy.webfiles; do\n  qemu-aarch64-static -L \"$root\" \"$root/bin/busybox\" sh -n \"$root/$path\"\ndone\nqemu-aarch64-static -L \"$root\" \"$root/usr/bin/lua\" -e 'assert(loadfile(os.getenv(\"CUDY_TEST_ROOT\")..\"/usr/lib/cudy-webfiles/adapter.lua\"))'\n\nfor path in etc/uci-defaults/96-cudy-zt-direct etc/hotplug.d/iface/96-cudy-zt-direct usr/libexec/cudy-zt-direct etc/init.d/zerotier; do\n  qemu-aarch64-static -L \"$root\" \"$root/bin/busybox\" sh -n \"$root/$path\"\ndone\nqemu-aarch64-static -L \"$root\" \"$root/usr/bin/lua\" tr3600/test-zt-direct.lua\nCUDY_TEST_ROOT=\"$root\" qemu-aarch64-static -L \"$root\" \"$root/usr/bin/lua\" -e 'assert(loadfile(os.getenv(\"CUDY_TEST_ROOT\")..\"/usr/libexec/cudy-zt-direct-run\"))'\n"
        },
        {
          "name": "Verify packed TR3600 image and prepare checked assets",
          "run": "set -Eeuo pipefail\npython3 tr3600/verify.py 2>&1 | tee reports/final-image-check.log"
        },
        {
          "name": "Prepare source provenance and checksum assets",
          "run": "python3 release/tr3600-1.1.1/prepare.py"
        },
        {
          "name": "Upload verified TR3600 1.1.1 candidate",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "cudy-tr3600-v1-1.1.1-${{ github.sha }}",
            "path": "tr3600-assets/",
            "retention-days": 90,
            "if-no-files-found": "error"
          }
        },
        {
          "name": "Preserve failed-check ARM64 root and packed verification inputs",
          "if": "failure() && steps.compile.outcome == 'success'",
          "run": "roots=(openwrt/build_dir/target-*/root-mediatek)\ntest \"${#roots[@]}\" = 1\ntar -C \"${roots[0]}\" -cJf reports/arm64-diagnostic-root.tar.xz .\npython3 tr3600/preserve-verification.py\n"
        },
        {
          "name": "Upload build diagnostics",
          "if": "always()",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "tr3600-diagnostics-${{ github.run_number }}",
            "path": "reports/*.json\nreports/*.config\nreports/*.txt\nprepare.log\ndownload.log\nbuild.log\npolicy-tests.log\nruntime-tests.log\nreports/*.log\nreports/arm64-diagnostic-root.tar.xz\nreports/packed-verification-inputs.tar.xz\nreports/webfiles-storage-packed-regressions.txt\nreports/webfiles-boot-regressions.txt\nreports/webfiles-boot-packed-verification.json",
            "retention-days": 14,
            "if-no-files-found": "warn",
            "include-hidden-files": true
          }
        }
      ],
      "needs": [
        "nixio-regression",
        "storage-regression",
        "boot-readiness-regression"
      ]
    },
    "nixio-regression": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 15,
      "steps": [
        {
          "name": "Checkout fix",
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Extract reviewed build source bundle",
          "run": "python3 - <<'PY'\nimport base64, hashlib, io, zipfile\nfrom pathlib import Path, PurePosixPath\ndata=base64.b64decode(Path('release20-test-failover1-source.zip.b64').read_text().strip(),validate=True)\nassert hashlib.sha256(data).hexdigest()=='8dc17ef842929725b10a0152569a690c7ffe148473b1005cd7d610cda510e787'\nwith zipfile.ZipFile(io.BytesIO(data)) as z:\n    assert z.testzip() is None\n    names=z.namelist()\n    assert len(names)==len(set(names))\n    for name in names:\n        p=PurePosixPath(name)\n        assert not p.is_absolute() and '..' not in p.parts and chr(92) not in name\n    listed=[]\n    for row in z.read('SOURCE-FILES-SHA256SUMS').decode().splitlines():\n        expected,name=row.split('  ',1)\n        assert hashlib.sha256(z.read(name)).hexdigest()==expected,name\n        listed.append(name)\n    assert set(listed)==set(names)-{'SOURCE-FILES-SHA256SUMS'}\n    z.extractall()\nassert Path('files/etc/mango-release').read_text().strip()=='20-test-failover1'\nPY"
        },
        {
          "name": "Install regression dependencies",
          "run": "sudo apt-get update\nsudo apt-get install -y qemu-user-static squashfs-tools lua5.1 nftables iproute2 samba samba-vfs-modules smbclient"
        },
        {
          "name": "Reproduce old and validate fixed backup permissions with real ARM64 nixio",
          "env": {
            "GH_TOKEN": "${{ secrets.GITHUB_TOKEN }}"
          },
          "run": "set -Eeuo pipefail\nmkdir -p reports extracted\nexec > >(tee reports/permission-regression.log) 2>&1\ngh run download 37301460168 --repo liuyong2027/mt300n-v2-openwrt --name cudy-tr3600-v1-mango20-test2 --dir downloaded\necho 'e72a713e570c1cd9ee5b461e23d0118a723c87b962210416e9e800fa5689c0ef  downloaded/openwrt-mediatek-filogic-cudy_tr3600-v1-squashfs-sysupgrade.bin' | sha256sum -c -\ntar -xf downloaded/openwrt-mediatek-filogic-cudy_tr3600-v1-squashfs-sysupgrade.bin -C extracted\npayloads=(extracted/sysupgrade-*/root)\ntest \"${#payloads[@]}\" = 1\nsudo unsquashfs -d extracted-root \"${payloads[0]}\"\nroot=\"$(realpath extracted-root)\"\nmkdir -p old-source/luci-app-cudy-led/root/usr/lib/lua/cudy old-source/luci-app-cudy-wifi/root/usr/libexec\ncp \"$root/usr/lib/lua/cudy/led-runtime.lua\" old-source/luci-app-cudy-led/root/usr/lib/lua/cudy/\ncp \"$root/usr/libexec/cudy-wifi-config\" old-source/luci-app-cudy-wifi/root/usr/libexec/\nexport CUDY_TEST_ROOT=\"$root\" LUA_CPATH=\"$root/usr/lib/lua/?.so\" LUA_PATH=\"$root/usr/lib/lua/?.lua;$root/usr/lib/lua/?/init.lua\"\nfor case_name in led wifi; do\n  export CUDY_PERMISSION_TEST_DIR=\"$(mktemp -d /tmp/cudy-permissions-XXXXXX)\" CUDY_PERMISSION_SOURCE=\"$PWD/old-source\" CUDY_PERMISSION_CASE=\"$case_name\"\n  if qemu-aarch64-static -L \"$root\" \"$root/usr/bin/lua\" tr3600/test-real-nixio.lua > \"reports/old-$case_name.log\" 2>&1; then\n    echo \"Old $case_name unexpectedly passed\"; exit 1\n  fi\n  grep -F \"bad argument #2 to 'chmod'\" \"reports/old-$case_name.log\"\ndone\nunset CUDY_PERMISSION_CASE\nset -Eeuo pipefail\nCUDY_PERMISSION_TEST_DIR=\"$(mktemp -d /tmp/cudy-permissions-XXXXXX)\"\nexport CUDY_PERMISSION_TEST_DIR CUDY_TEST_ROOT=\"$root\" CUDY_PERMISSION_SOURCE=\"$PWD/tr3600\"\nexport LUA_CPATH=\"$root/usr/lib/lua/?.so\" LUA_PATH=\"$root/usr/lib/lua/?.lua;$root/usr/lib/lua/?/init.lua\"\nqemu-aarch64-static -L \"$root\" \"$root/usr/bin/lua\" tr3600/test-real-nixio.lua\ntest \"$(stat -c %a \"$CUDY_PERMISSION_TEST_DIR/led\")\" = 700\ntest \"$(stat -c %a \"$CUDY_PERMISSION_TEST_DIR/led/sample.json\")\" = 600\ntest \"$(stat -c %a \"$CUDY_PERMISSION_TEST_DIR/wifi.json\")\" = 600\necho 'PASS actual ARM64 private directory/file permissions 700/600/600'\nlua5.1 tr3600/test-led-runtime.lua\nlua5.1 tr3600/test-wifi.lua\n"
        },
        {
          "name": "Validate USB policy and real ARM64 UCI/nixio before rebuilding",
          "run": "set -Eeuo pipefail\nlua5.1 tr3600/test-usb.lua\npython3 tr3600/test-usb-integration.py\nnode --check tr3600/luci-app-cudy-usb/htdocs/luci-static/resources/view/cudy-usb.js\nnode tr3600/test-usb-ui.cjs\nnode tr3600/test-menu-tabs.cjs\nluac5.1 -p tr3600/luci-app-cudy-usb/root/usr/libexec/cudy-usb-main\nluac5.1 -p tr3600/luci-app-cudy-usb/root/usr/lib/lua/cudy/usb-runtime.lua\nsh -n tr3600/luci-app-cudy-usb/root/usr/libexec/cudy-usb tr3600/luci-app-cudy-usb/root/etc/init.d/cudy_usb tr3600/luci-app-cudy-usb/root/etc/uci-defaults/94-cudy-usb tr3600/luci-app-cudy-usb/root/etc/hotplug.d/block/99-cudy-usb\n\nroot=\"$(realpath extracted-root)\"\nexport CUDY_TEST_ROOT=\"$root\" LUA_CPATH=\"$root/usr/lib/lua/?.so\" LUA_PATH=\"$root/usr/lib/lua/?.lua;$root/usr/lib/lua/?/init.lua\"\nexport CUDY_USB_TEST_DIR=\"$(mktemp -d /tmp/cudy-usb-test-XXXXXX)\" CUDY_USB_SOURCE=\"$PWD/tr3600\"\nqemu-aarch64-static -L \"$root\" \"$root/usr/bin/lua\" tr3600/test-usb-real.lua 2>&1 | tee reports/usb-regression.log\n"
        },
        {
          "name": "Validate private SS and new LED behavior before rebuilding",
          "run": "set -Eeuo pipefail\nmodule=tr3600/luci-app-cudy-ss/root/usr/lib/mango/ss-zt.lua\nlua5.1 tr3600/test-ss.lua \"$module\"\nlua5.1 tr3600/test-ss-settings.lua \"$module\"\nlua5.1 tr3600/test-ss-setup.lua \"$module\"\nlua5.1 tr3600/test-ss-transaction.lua tr3600/luci-app-cudy-ss/root/usr/lib/mango/ss-transaction.lua\npython3 tr3600/test-ss-integration.py\nnode --check tr3600/luci-app-cudy-ss/htdocs/luci-static/resources/view/cudy-ss.js\nnode tr3600/test-ss-ui.cjs\nsudo unshare --net sh tr3600/test-ss-nft.sh\n\nlua5.1 tr3600/test-led.lua\nlua5.1 tr3600/test-led-runtime.lua\nroot=\"$(realpath extracted-root)\"\nbash tr3600/test-ss-ci.sh \"$root\" 2>&1 | tee reports/ss-regression.log\n"
        },
        {
          "name": "Upload permission regression reports",
          "if": "always()",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "tr3600-nixio-regression",
            "path": "reports/*.log",
            "if-no-files-found": "warn"
          }
        }
      ]
    },
    "publish": {
      "needs": [
        "nixio-regression",
        "storage-regression",
        "build",
        "boot-readiness-regression"
      ],
      "if": "github.repository == 'liuyong2027/mt300n-v2-openwrt' && github.ref == 'refs/heads/codex/tr3600-webfiles-1.1.1'",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 30,
      "permissions": {
        "contents": "write",
        "actions": "read"
      },
      "steps": [
        {
          "name": "Checkout exact candidate publication code",
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Download this run candidate assets",
          "uses": "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093",
          "with": {
            "name": "cudy-tr3600-v1-1.1.1-${{ github.sha }}",
            "path": "tr3600-assets"
          }
        },
        {
          "name": "Upload verified assets and publish stable release",
          "env": {
            "GH_TOKEN": "${{ secrets.GITHUB_TOKEN }}"
          },
          "run": "python3 release/tr3600-1.1.1/publish.py"
        },
        {
          "name": "Preserve publication receipt",
          "if": "always()",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "tr3600-1.1.1-publication-receipt",
            "path": "PUBLICATION-VERIFICATION-1.1.1.json",
            "if-no-files-found": "warn",
            "retention-days": 90
          }
        }
      ]
    },
    "storage-regression": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 15,
      "steps": [
        {
          "name": "Checkout reviewed storage-mode fix",
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Verify real ARM64 storage restoration using the published stable1.1.0 image",
          "env": {
            "GH_TOKEN": "${{ secrets.GITHUB_TOKEN }}"
          },
          "run": "set -Eeuo pipefail\nsudo apt-get update\nsudo apt-get install -y qemu-user-static squashfs-tools\nmkdir -p reference proof\ngh release download tr3600-v1.1.0 --repo liuyong2027/mt300n-v2-openwrt --pattern cudy-tr3600-v1-1.1.0-sysupgrade.bin --dir reference\necho 'c2abceeddaec72df75066f1f6e0f745a07fab2db937ff1945be93a44e2f85d11  reference/cudy-tr3600-v1-1.1.0-sysupgrade.bin' | sha256sum -c -\ntar -xf reference/cudy-tr3600-v1-1.1.0-sysupgrade.bin -C reference\npayloads=(reference/sysupgrade-*/root)\ntest \"${#payloads[@]}\" = 1\nsudo unsquashfs -d reference/rootfs \"${payloads[0]}\" > proof/extract.log\nimage_root=\"$PWD/reference/rootfs\"\ntest_root=$(sudo mktemp -d /tmp/cudy-webfiles-storage-test.XXXXXX)\ntrap 'sudo rm -rf -- \"$test_root\"' EXIT\nsudo env LUA_CPATH=\"$image_root/usr/lib/lua/?.so\" LUA_PATH=\"$image_root/usr/lib/lua/?.lua;$image_root/usr/lib/lua/?/init.lua\" qemu-aarch64-static -L \"$image_root\" \"$image_root/usr/bin/lua\" tr3600/test-webfiles-storage.lua \"$test_root\" \"$PWD/tr3600/cudy-webfiles/root/usr/lib/lua/cudy/webfiles-storage.lua\" | tee proof/storage-regressions.txt\ngrep -Fx 'PASS all11 native storage restoration regressions' proof/storage-regressions.txt\nbash -n tr3600/cudy-webfiles/root/etc/init.d/cudy-webfiles tr3600/cudy-webfiles/root/etc/uci-defaults/98-cudy-webfiles\npython3 - <<'PY'\nimport hashlib,json,os\nfrom pathlib import Path\nroot=Path('tr3600/cudy-webfiles/root')\ncall='/usr/bin/lua /usr/lib/cudy-webfiles/prepare-storage.lua || '\ninit=(root/'etc/init.d/cudy-webfiles').read_text()\nboot=(root/'etc/uci-defaults/98-cudy-webfiles').read_text()\nassert init.index(call) < init.index('\"$helper\" reset')\nassert boot.index(call+'exit 1') < boot.index('/etc/init.d/cudy-webfiles enable')\nassert (root/'usr/lib/cudy-webfiles/prepare-storage.lua').read_text().count(\"prepare('/etc/cudy-webfiles', 0)\")==1\nfiles=sorted([p for p in root.rglob('*') if p.is_file()]+[Path('tr3600/test-webfiles-storage.lua'),Path('tr3600/cudy-webfiles/Makefile')])\nproof={'source_commit':os.environ['GITHUB_SHA'],'reference_image_sha256':'c2abceeddaec72df75066f1f6e0f745a07fab2db937ff1945be93a44e2f85d11','runtime':'Actual ARM64 Lua/nixio extracted from published stable1.1.0 under QEMU, root fixtures','storage_regressions_passed':11,'real_account_or_certificate_data_used':False,'full_firmware_rebuilt':False,'hardware_boot_of_new_firmware_tested':False,'files':{str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in files}}\nPath('proof/storage-verification.json').write_text(json.dumps(proof,indent=2)+'\\n')\nPY\n"
        },
        {
          "name": "Check Dynu migration and actual ARM64 resolver/updater before the full build",
          "run": "set -euo pipefail\npython3 tr3600/test-dynu-https.py \"$PWD/reference/rootfs\" \"$PWD/tr3600/network-root\" | tee proof/ddns-https-preregressions.txt\nsh -n tr3600/network-root/usr/lib/ddns/update_cudy_dynu_https.sh tr3600/network-root/etc/uci-defaults/97-cudy-dynu-https\n"
        },
        {
          "name": "Exercise LED ownership and shared HTTP detection on actual ARM64 before the full build",
          "run": "set -euo pipefail\npython3 tr3600/test-led-shared-packed.py \"$PWD/reference/rootfs\" \"$PWD/tr3600\" | tee proof/led-shared-probe-preregressions.txt\n"
        },
        {
          "name": "Preserve regression evidence",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "tr3600-storage-preregression-${{ github.sha }}",
            "path": "proof/",
            "if-no-files-found": "error",
            "retention-days": 90
          }
        }
      ]
    },
    "boot-readiness-regression": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 20,
      "steps": [
        {
          "name": "Checkout reviewed source",
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Set up pinned Go compiler",
          "uses": "actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16",
          "with": {
            "go-version": "1.27.2",
            "cache": false
          }
        },
        {
          "name": "Install Lua and ARM64 emulator",
          "run": "sudo apt-get update\nsudo apt-get install -y lua5.1 qemu-user-static\nmkdir -p reports"
        },
        {
          "name": "Check consent, keep-list and scripts",
          "run": "python3 tr3600/webfiles/test_integration.py\nsh -n tr3600/cudy-webfiles/root/etc/init.d/cudy-webfiles\nnode --check tr3600/luci-app-cudy-webfiles/htdocs/luci-static/resources/view/cudy-webfiles.js"
        },
        {
          "name": "Native and actual ARM64 regressions; build bound helper",
          "run": "set -euo pipefail\ncd tr3600/webfiles/helper\nCGO_ENABLED=0 go test -count=1 -json ./... > ../../../reports/bootfix-host-tests.jsonl\nCGO_ENABLED=0 GOOS=linux GOARCH=arm64 go vet ./...\nCGO_ENABLED=0 GOOS=linux GOARCH=arm64 go test -c -o ../../../reports/bootfix-arm64.test .\nsudo qemu-aarch64-static ../../../reports/bootfix-arm64.test -test.v > ../../../reports/bootfix-arm64-tests.txt\nCGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -buildvcs=false -trimpath -ldflags \"-s -w -X main.quantumHash=c10353ecce3159edb2445a45dbcdce45433248c1e05e7beea5aa52cec00866c2\" -o ../../../reports/cudy-webfiles-0.6.6 .\ncd ../../..\nsha256sum reports/cudy-webfiles-0.6.6 > reports/bootfix-helper-SHA256SUMS\npython3 - <<'PY'\nfrom pathlib import Path\nimport json,hashlib\np=Path(\"reports/cudy-webfiles-0.6.6\")\nm=json.loads(Path(\"tr3600/webfiles/manifest-template.json\").read_text())\nm[\"helperSHA256\"]=hashlib.sha256(p.read_bytes()).hexdigest()\nm[\"quantum\"][\"sha256\"]=\"c10353ecce3159edb2445a45dbcdce45433248c1e05e7beea5aa52cec00866c2\"\nPath(\"reports/bootfix-manifest.json\").write_text(json.dumps(m,indent=2)+\"\\n\")\nPY"
        },
        {
          "name": "Exercise early-start diagnostics in isolated mount namespace before long build",
          "run": "set -euo pipefail\nmkdir -p reports/boot-fixture/usr/lib/cudy-webfiles/bin\ncp reports/cudy-webfiles-0.6.6 reports/boot-fixture/usr/lib/cudy-webfiles/bin/cudy-webfiles\nsudo unshare --mount --fork sh tr3600/webfiles/test_packed_boot.sh \"$(realpath reports/boot-fixture)\" > reports/bootfix-early-diagnostic-fixture.json\npython3 - <<'PY'\nimport hashlib,json\nfrom pathlib import Path\na=json.loads(Path(\"release/tr3600-1.1.1/COMPONENT-ACCEPTANCE.json\").read_text())\nassert hashlib.sha256(Path(\"reports/cudy-webfiles-0.6.6\").read_bytes()).hexdigest()==a[\"helper_sha256\"]\nassert json.loads(Path(\"reports/bootfix-early-diagnostic-fixture.json\").read_text())[\"actual_packed_ARM64_boot_action\"]==\"passed\"\nPY"
        },
        {
          "name": "Upload component and regression evidence",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "tr3600-1.1.1-boot-regressions",
            "path": "reports/cudy-webfiles-0.6.6\nreports/bootfix-*.json*\nreports/bootfix-*.txt\nreports/bootfix-helper-SHA256SUMS",
            "if-no-files-found": "error",
            "retention-days": 30
          }
        }
      ]
    }
  }
}
