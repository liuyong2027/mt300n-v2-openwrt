{
  "name": "Review r8 P2/P3 recovery protection",
  "on": {
    "push": {
      "branches": [
        "review20-r8-p2p3-20261001"
      ],
      "paths": [
        "review20-r8-p2p3.tar.gz.b64",
        ".github/workflows/review20-r8-p2p3.yml"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "review20-r8-p2p3-${{ github.ref }}",
    "cancel-in-progress": false
  },
  "jobs": {
    "test": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 15,
      "defaults": {
        "run": {
          "shell": "bash"
        }
      },
      "steps": [
        {
          "name": "Checkout build recipe",
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Verify isolated test source",
          "run": "set -euo pipefail\npython3 - <<'PY'\nfrom pathlib import Path,PurePosixPath\nimport base64,hashlib,io,tarfile\ndata=base64.b64decode(Path('review20-r8-p2p3.tar.gz.b64').read_text())\nassert hashlib.sha256(data).hexdigest()=='1c39a445efc0d778068d0117d5e4d53ab9e2e88669b868ef361697de4a0efe84'\nwith tarfile.open(fileobj=io.BytesIO(data),mode='r:gz') as tar:\n names=[]\n for entry in tar.getmembers():\n  p=PurePosixPath(entry.name)\n  assert entry.isfile() and not p.is_absolute() and '..' not in p.parts\n  names.append(entry.name)\n assert len(names)==len(set(names))\n tar.extractall(filter='data')\nfor row in Path('TEST-FILES-SHA256SUMS').read_text().splitlines():\n expected,name=row.split('  ',1)\n assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==expected,name\nPY\nmkdir -p reports\n"
        },
        {
          "name": "Install kernel test tools",
          "run": "sudo apt-get update\nsudo apt-get install -y nftables iproute2 iputils-ping"
        },
        {
          "name": "Private recovery regressions and negative controls",
          "run": "set -euo pipefail\n{\nsh tests/test_recovery_guard.sh\nsh tests/test_fw_installed.sh package/luci-app-mango-proxy/root/usr/libexec/mango-fw\nsh tests/test_fw_reuse.sh package/luci-app-mango-proxy/root/etc/init.d/mango_proxy\nsh tests/test_start_failure.sh\nsh tests/test_switch_perf.sh\nsh tests/test_china_recovery.sh\nsh tests/test_china_recovery_negative.sh\n} 2>&1 | tee reports/private-regressions.log"
        },
        {
          "name": "Real nft isolated forwarding test",
          "run": "set -euo pipefail\nsudo unshare --net sh tests/test_recovery_guard_nft.sh 2>&1 | tee reports/kernel-forwarding.log"
        },
        {
          "name": "Upload diagnostics only",
          "if": "always()",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "review20-r8-p2p3-diagnostics-${{ github.run_number }}",
            "path": "reports",
            "if-no-files-found": "error",
            "retention-days": 14
          }
        }
      ]
    }
  }
}
