name: Release 22 verification diagnostics
on:
  push:
    branches: [codex/mt300n-v2-release22]
    paths: [.github/workflows/release22-diagnose.yml]
permissions:
  actions: read
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Extract failed target check log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --allow-escape-sequences repos/liuyong2027/mt300n-v2-openwrt/actions/jobs/117404399293/logs > job.log
          python3 - <<'PY'
          from pathlib import Path
          data=Path('job.log').read_text(errors='replace')
          start=data.rfind('##[group]Run python3 scripts/verify-zt-target.py')
          if start<0: start=max(0,len(data)-16000)
          text=data[start:][-16000:]
          Path('failure-tail.txt').write_text(text)
          print(text)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release22-target-failure
          path: failure-tail.txt
          retention-days: 3
