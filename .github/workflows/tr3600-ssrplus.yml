{
  "name": "Cudy TR3600 SSR Plus+ test firmware",
  "on": {
    "push": {
      "branches": [
        "codex/tr3600-ssrplus"
      ],
      "paths": [
        "tr3600/ssrplus/**",
        ".github/workflows/tr3600-ssrplus.yml"
      ]
    },
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "tr3600-ssrplus-${{ github.ref }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "build": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 330,
      "defaults": {
        "run": {
          "shell": "bash"
        }
      },
      "steps": [
        {
          "name": "Checkout build recipe",
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Set up pinned Go compiler",
          "uses": "actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16",
          "with": {
            "go-version": "1.27.2",
            "cache": false
          }
        },
        {
          "name": "Set up pinned frontend Node runtime",
          "uses": "actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38",
          "with": {
            "node-version": "24.19.0"
          }
        },
        {
          "name": "Checkout exact Quantum source",
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "repository": "gtsteffaniak/filebrowser",
            "ref": "a29573e7068a4a682f199b64bec3e206159f535c",
            "path": "vendor/quantum",
            "persist-credentials": false
          }
        },
        {
          "name": "Install build dependencies",
          "run": "sudo apt-get update\nsudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev libelf-dev python3 python3-setuptools python3-venv squashfs-tools socat python3-pyelftools rsync swig unzip zlib1g-dev file wget curl zstd xz-utils bzip2 ccache xsltproc cpio lua5.1 nftables iproute2 iputils-ping qemu-user-static samba samba-vfs-modules smbclient\nmkdir -p reports\n# Free space for OpenWrt and two Go source trees; only hosted-runner tool caches.\nsudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet\ndf -h .\ndf -h . | tee reports/disk-before.txt"
        },
        {
          "name": "Validate replacement and private SS migration",
          "run": "python3 -m venv .test-venv\n.test-venv/bin/pip install lupa==2.8\n.test-venv/bin/python tr3600/ssrplus/test_profile.py"
        },
        {
          "name": "Test actual namespace routing and private scope",
          "run": "python3 tr3600/ssrplus/test_network.py"
        },
        {
          "name": "Prepare SSR Plus+ profile",
          "run": "python3 tr3600/ssrplus/profile.py\nsh -n tr3600/ssrplus/migration.sh\nbash -n scripts/prepare.sh"
        },
        {
          "name": "Build guarded WebFiles and patched Quantum from pinned sources",
          "run": "python3 tr3600/webfiles/build.py\npython3 tr3600/webfiles/test_binary_guard.py tr3600/cudy-webfiles/build-output/cudy-webfiles tr3600/cudy-webfiles/build-output/filebrowser --report reports/webfiles-arm64-binary-guard.json\n"
        },
        {
          "name": "Resolve exact OpenWrt and SSR Plus+ sources",
          "run": "bash scripts/prepare.sh 2>&1 | tee prepare.log\npython3 tr3600/ssrplus/check_config.py"
        },
        {
          "name": "Fetch build inputs",
          "working-directory": "openwrt",
          "run": "make download -j4 2>&1 | tee ../download.log"
        },
        {
          "name": "Build host tools and validate pinned Go compiler",
          "working-directory": "openwrt",
          "run": "make -j2 tools/install V=s 2>&1 | tee ../reports/host-tools-build.log\nmake -j2 package/feeds/packages/golang/host/compile V=s 2>&1 | tee ../reports/golang-host-build.log\ngo_version=$(GOTOOLCHAIN=local staging_dir/hostpkg/lib/go-1.27/bin/go version)\nprintf '%s\\n' \"$go_version\" | tee ../reports/golang-host-version.txt\ntest \"$go_version\" = 'go version go1.27.3 linux/amd64'"
        },
        {
          "name": "Compile SSR Plus+ test firmware",
          "id": "compile",
          "working-directory": "openwrt",
          "run": "make -j2 V=s 2>&1 | tee ../build.log"
        },
        {
          "name": "Verify packed image and actual ARM64 programs",
          "run": "python3 tr3600/ssrplus/verify.py 2>&1 | tee reports/ssrplus-packed-verification.log"
        },
        {
          "name": "Upload checked test firmware",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "cudy-tr3600-ssrplus-test1-${{ github.sha }}",
            "path": "ssrplus-assets/",
            "if-no-files-found": "error",
            "retention-days": 30
          }
        },
        {
          "name": "Upload diagnostics",
          "if": "always()",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "tr3600-ssrplus-diagnostics-${{ github.run_number }}",
            "path": "reports/\nprepare.log\ndownload.log\nbuild.log",
            "retention-days": 14,
            "if-no-files-found": "warn"
          }
        }
      ]
    }
  }
}
