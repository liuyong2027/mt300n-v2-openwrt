{
  "name": "Cudy TR3600 v1 - Mango test2 (no L2TP/DDNS)",
  "on": {
    "push": {
      "branches": [
        "codex/cudy-tr3600-1f61697"
      ],
      "paths": [
        "tr3600/**",
        ".github/workflows/tr3600-test.yml"
      ]
    },
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "concurrency": {
    "group": "tr3600-${{ github.ref }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "build": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 330,
      "defaults": {
        "run": {
          "shell": "bash"
        }
      },
      "env": {
        "MANGO_BUILD_PROFILE": "standard"
      },
      "steps": [
        {
          "name": "Checkout build recipe",
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Extract reviewed build source bundle",
          "run": "python3 - <<'PY'\nimport base64, hashlib, io, zipfile\nfrom pathlib import Path, PurePosixPath\ndata=base64.b64decode(Path('release20-test-failover1-source.zip.b64').read_text().strip(),validate=True)\nassert hashlib.sha256(data).hexdigest()=='8dc17ef842929725b10a0152569a690c7ffe148473b1005cd7d610cda510e787'\nwith zipfile.ZipFile(io.BytesIO(data)) as z:\n    assert z.testzip() is None\n    names=z.namelist()\n    assert len(names)==len(set(names))\n    for name in names:\n        p=PurePosixPath(name)\n        assert not p.is_absolute() and '..' not in p.parts and chr(92) not in name\n    listed=[]\n    for row in z.read('SOURCE-FILES-SHA256SUMS').decode().splitlines():\n        expected,name=row.split('  ',1)\n        assert hashlib.sha256(z.read(name)).hexdigest()==expected,name\n        listed.append(name)\n    assert set(listed)==set(names)-{'SOURCE-FILES-SHA256SUMS'}\n    z.extractall()\nassert Path('files/etc/mango-release').read_text().strip()=='20-test-failover1'\nPY"
        },
        {
          "name": "Install build dependencies",
          "run": "sudo apt-get update\nsudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev libelf-dev python3 python3-setuptools python3-pyelftools rsync swig unzip zlib1g-dev file wget curl zstd xz-utils bzip2 ccache xsltproc lua5.1 nftables iproute2 iputils-ping qemu-user-static\nmkdir -p reports\ndf -h . | tee reports/disk-before.txt"
        },
        {
          "name": "Validate status LEDs, Wi-Fi unification, network defaults and feature retirement",
          "run": "lua5.1 tr3600/test-led.lua\nlua5.1 tr3600/test-led-runtime.lua\nnode --check tr3600/luci-app-cudy-led/htdocs/luci-static/resources/view/cudy-led.js\nnode tr3600/test-led-ui.cjs\nluac5.1 -p tr3600/luci-app-cudy-led/root/usr/libexec/cudy-led-control\nfor path in tr3600/luci-app-cudy-led/root/usr/libexec/cudy-led-apply tr3600/luci-app-cudy-led/root/usr/libexec/cudy-led-run tr3600/luci-app-cudy-led/root/usr/libexec/cudy-led-upgrade tr3600/luci-app-cudy-led/root/etc/init.d/cudy_led tr3600/luci-app-cudy-led/root/etc/uci-defaults/92-cudy-led tr3600/luci-app-cudy-led/root/etc/hotplug.d/ntp/95-cudy-led; do sh -n \"$path\"; done\npython3 tr3600/test-led-integration.py\nsh tr3600/test-led-probe.sh\nsh tr3600/test-led-lifecycle.sh\npython3 scripts/audit-installed-content.py tr3600/luci-app-cudy-led/root\nlua5.1 tr3600/test-wifi.lua\nnode --check tr3600/luci-app-cudy-wifi/htdocs/luci-static/resources/view/cudy-wifi.js\nnode tr3600/test-wifi-ui.cjs\nluac5.1 -p tr3600/luci-app-cudy-wifi/root/usr/libexec/cudy-wifi-config\nsh -n tr3600/luci-app-cudy-wifi/root/usr/libexec/cudy-wifi-apply tr3600/luci-app-cudy-wifi/root/etc/init.d/cudy_wifi tr3600/luci-app-cudy-wifi/root/etc/uci-defaults/93-cudy-wifi\nsh tr3600/test-network.sh\npython3 tr3600/test-feature-retirement.py\npython3 tr3600/test-network-defaults.py\n"
        },
        {
          "name": "Validate recipe",
          "run": "python3 -m unittest discover -s tests -v\nsh tests/test_switch_perf.sh .\nsh tests/test_probe_logging.sh .\nsh tests/test_watchdog_startup.sh .\nnode tests/test-ui.cjs\nnode tests/test-site-ui.cjs\nnode tests/subscription.cjs\nnode tests/test-update-progress.cjs\nbash -n scripts/prepare.sh scripts/validate-runtime.sh\nfor f in package/luci-app-mango-proxy/root/usr/libexec/mango-* package/luci-app-mango-proxy/root/usr/libexec/rpcd/mango package/luci-app-mango-proxy/root/etc/init.d/mango_* package/luci-app-mango-proxy/root/etc/uci-defaults/9*-mango-*; do if head -n1 \"$f\" | grep -q lua; then continue; fi; sh -n \"$f\"; done\nnode --check package/luci-app-mango-proxy/htdocs/luci-static/resources/view/mango-proxy.js\nnode --check package/luci-app-mango-proxy/htdocs/luci-static/resources/mango/subscription.js\nsh tests/test_cache_refresh.sh .\nsh tests/test_fw_reuse.sh package/luci-app-mango-proxy/root/etc/init.d/mango_proxy\nsh tests/test_recovery_trace.sh package/luci-app-mango-proxy/root/etc/init.d/mango_proxy package/luci-app-mango-proxy/root/usr/libexec/mango-failover\nsh tests/test_fw_installed.sh package/luci-app-mango-proxy/root/usr/libexec/mango-fw\nsh tests/test_recovery_policy.sh .\nsh tests/test_uplink.sh .\nsh tests/test_runtime_id.sh .\nsh tests/test_start_failure.sh .\npython3 scripts/loading-diagnostic/test-diagnostic.py\nsh tests/test_lifecycle_budget.sh .\nsh tests/test_apply_rollback.sh .\nsh tests/test_process_wait.sh package/luci-app-mango-proxy/root/usr/libexec/mango-process\nsh tests/test_preflight_phases.sh .\nsh tests/test_preflight_reuse.sh .\npython3 scripts/audit-installed-content.py files\npython3 scripts/audit-installed-content.py package/luci-app-mango-proxy/root"
        },
        {
          "name": "Adapt verified source for TR3600 v1",
          "run": "python3 tr3600/port.py\nbash -n tr3600/cudy-upgrade.sh\nbash tr3600/test-upgrade.sh"
        },
        {
          "name": "Validate routing policy and nftables",
          "run": "bash scripts/validate-runtime.sh 2>&1 | tee policy-tests.log"
        },
        {
          "name": "Prepare locked OpenWrt sources with TR3600 support",
          "run": "bash scripts/prepare.sh 2>&1 | tee prepare.log\npython3 tr3600/check-required.py"
        },
        {
          "name": "Download selected sources",
          "working-directory": "openwrt",
          "run": "make download -j4 2>&1 | tee ../download.log"
        },
        {
          "name": "Compile Cudy TR3600 v1 test firmware",
          "run": "make -j2 V=s 2>&1 | tee ../build.log",
          "id": "compile",
          "working-directory": "openwrt"
        },
        {
          "name": "Validate actual ARM64 Xray configuration",
          "run": "set -Eeuo pipefail\nbash scripts/validate-runtime.sh arm64 2>&1 | tee runtime-tests.log"
        },
        {
          "name": "Check actual ARM64 BusyBox syntax and installed content",
          "run": "set -Eeuo pipefail\nexec > >(tee reports/arm64-content-check.log) 2>&1\nset -x\nroots=(openwrt/build_dir/target-*/root-mediatek)\ntest \"${#roots[@]}\" = 1\nroot=\"$(realpath \"${roots[0]}\")\"\nfor path in usr/libexec/mango-recovery-guard etc/init.d/mango_proxy lib/upgrade/cudy-tr3600.sh etc/uci-defaults/91-cudy-retire-services etc/hotplug.d/iface/95-cudy-tr3600-eee etc/init.d/cudy_wifi etc/uci-defaults/93-cudy-wifi usr/libexec/cudy-wifi-apply usr/libexec/mango-probe sbin/sysupgrade usr/libexec/cudy-led-apply usr/libexec/cudy-led-run usr/libexec/cudy-led-upgrade etc/init.d/cudy_led etc/uci-defaults/92-cudy-led etc/hotplug.d/ntp/95-cudy-led; do\n  qemu-aarch64-static -L \"$root\" \"$root/bin/busybox\" sh -n \"$root/$path\"\ndone\npython3 tr3600/check-removed.py \"$root\" openwrt/.config\nCUDY_TEST_ROOT=\"$root\" python3 tr3600/test-feature-retirement.py\npython3 scripts/audit-installed-content.py \"$root\" > reports/installed-content-audit.json\nqemu-aarch64-static -L \"$root\" \"$root/usr/bin/lua\" tr3600/test-wifi.lua \"$root/usr/lib/lua/cudy/wifi.lua\"\nCUDY_TEST_ROOT=\"$root\" qemu-aarch64-static -L \"$root\" \"$root/usr/bin/lua\" -e 'assert(loadfile(os.getenv(\"CUDY_TEST_ROOT\")..\"/usr/libexec/cudy-wifi-config\"))'\ncat > reports/cudy-test-lua <<'SH'\n#!/bin/sh\nexec qemu-aarch64-static -L \"$CUDY_TEST_ROOT\" \"$CUDY_TEST_ROOT/usr/bin/lua\" \"$@\"\nSH\nchmod +x reports/cudy-test-lua\nCUDY_TEST_ROOT=\"$root\" LUA_CPATH=\"$root/usr/lib/lua/?.so\" CUDY_TEST_LUA=\"$PWD/reports/cudy-test-lua\" sh tr3600/test-wifi-real-uci.sh tr3600/test-wifi-real-uci.lua \"$root/usr/lib/lua/cudy/wifi.lua\"\nqemu-aarch64-static -L \"$root\" \"$root/usr/libexec/timeout-coreutils\" 2 /bin/true\nset +e\nqemu-aarch64-static -L \"$root\" \"$root/usr/libexec/timeout-coreutils\" 1 /bin/sleep 5\ncudy_timeout_result=$?\nset -e\ntest \"$cudy_timeout_result\" = 124\nqemu-aarch64-static -L \"$root\" \"$root/usr/bin/lua\" tr3600/test-led.lua \"$root/usr/lib/lua/cudy/led.lua\"\nqemu-aarch64-static -L \"$root\" \"$root/usr/bin/lua\" tr3600/test-led-runtime.lua \"$root/usr/lib/lua/cudy/led.lua\" \"$root/usr/lib/lua/cudy/led-runtime.lua\"\nCUDY_TEST_ROOT=\"$root\" qemu-aarch64-static -L \"$root\" \"$root/usr/bin/lua\" -e 'assert(loadfile(os.getenv(\"CUDY_TEST_ROOT\")..\"/usr/libexec/cudy-led-control\"))'\nCUDY_TEST_ROOT=\"$root\" LUA_CPATH=\"$root/usr/lib/lua/?.so\" LUA_PATH=\"$root/usr/lib/lua/?.lua;$root/usr/lib/lua/?/init.lua\" qemu-aarch64-static -L \"$root\" \"$root/usr/bin/lua\" -e 'local j=require(\"luci.jsonc\"); require(\"nixio.fs\"); require(\"uci\"); local r=require(\"cudy.led-runtime\"); assert(j.parse(j.stringify({result=true})).result); local c=assert(require(\"cudy.led\").config()); assert(c.mode==\"status\")'\n\nset -Eeuo pipefail\nCUDY_PERMISSION_TEST_DIR=\"$(mktemp -d /tmp/cudy-permissions-XXXXXX)\"\nexport CUDY_PERMISSION_TEST_DIR CUDY_TEST_ROOT=\"$root\" CUDY_PERMISSION_SOURCE=\"$PWD/tr3600\"\nexport LUA_CPATH=\"$root/usr/lib/lua/?.so\" LUA_PATH=\"$root/usr/lib/lua/?.lua;$root/usr/lib/lua/?/init.lua\"\nqemu-aarch64-static -L \"$root\" \"$root/usr/bin/lua\" tr3600/test-real-nixio.lua\ntest \"$(stat -c %a \"$CUDY_PERMISSION_TEST_DIR/led\")\" = 700\ntest \"$(stat -c %a \"$CUDY_PERMISSION_TEST_DIR/led/sample.json\")\" = 600\ntest \"$(stat -c %a \"$CUDY_PERMISSION_TEST_DIR/wifi.json\")\" = 600\necho 'PASS actual ARM64 private directory/file permissions 700/600/600'\n"
        },
        {
          "name": "Verify packed TR3600 image and prepare checked assets",
          "run": "set -Eeuo pipefail\npython3 tr3600/verify.py 2>&1 | tee reports/final-image-check.log"
        },
        {
          "name": "Upload verified TR3600 test firmware",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "cudy-tr3600-v1-mango20-test2",
            "path": "tr3600-assets/",
            "retention-days": 90,
            "if-no-files-found": "error"
          }
        },
        {
          "name": "Preserve failed-check ARM64 root and packed verification inputs",
          "if": "failure() && steps.compile.outcome == 'success'",
          "run": "roots=(openwrt/build_dir/target-*/root-mediatek)\ntest \"${#roots[@]}\" = 1\ntar -C \"${roots[0]}\" -cJf reports/arm64-diagnostic-root.tar.xz .\npython3 tr3600/preserve-verification.py\n"
        },
        {
          "name": "Upload build diagnostics",
          "if": "always()",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "tr3600-diagnostics-${{ github.run_number }}",
            "path": "reports/*.json\nreports/*.config\nreports/*.txt\nprepare.log\ndownload.log\nbuild.log\npolicy-tests.log\nruntime-tests.log\nreports/*.log\nreports/arm64-diagnostic-root.tar.xz\nreports/packed-verification-inputs.tar.xz",
            "retention-days": 14,
            "if-no-files-found": "warn",
            "include-hidden-files": true
          }
        }
      ],
      "needs": "nixio-regression"
    },
    "nixio-regression": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 15,
      "steps": [
        {
          "name": "Checkout fix",
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Install regression dependencies",
          "run": "sudo apt-get update\nsudo apt-get install -y qemu-user-static squashfs-tools lua5.1"
        },
        {
          "name": "Reproduce old and validate fixed backup permissions with real ARM64 nixio",
          "env": {
            "GH_TOKEN": "${{ secrets.GITHUB_TOKEN }}"
          },
          "run": "set -Eeuo pipefail\nmkdir -p reports extracted\ngh run download 37301460168 --repo liuyong2027/mt300n-v2-openwrt --name cudy-tr3600-v1-mango20-test2 --dir downloaded\necho 'e72a713e570c1cd9ee5b461e23d0118a723c87b962210416e9e800fa5689c0ef  downloaded/openwrt-mediatek-filogic-cudy_tr3600-v1-squashfs-sysupgrade.bin' | sha256sum -c -\ntar -xf downloaded/openwrt-mediatek-filogic-cudy_tr3600-v1-squashfs-sysupgrade.bin -C extracted\npayloads=(extracted/sysupgrade-*/root)\ntest \"${#payloads[@]}\" = 1\nunsquashfs -d extracted-root \"${payloads[0]}\"\nroot=\"$(realpath extracted-root)\"\nmkdir -p old-source/luci-app-cudy-led/root/usr/lib/lua/cudy old-source/luci-app-cudy-wifi/root/usr/libexec\ncp \"$root/usr/lib/lua/cudy/led-runtime.lua\" old-source/luci-app-cudy-led/root/usr/lib/lua/cudy/\ncp \"$root/usr/libexec/cudy-wifi-config\" old-source/luci-app-cudy-wifi/root/usr/libexec/\nexport CUDY_TEST_ROOT=\"$root\" LUA_CPATH=\"$root/usr/lib/lua/?.so\" LUA_PATH=\"$root/usr/lib/lua/?.lua;$root/usr/lib/lua/?/init.lua\"\nfor case_name in led wifi; do\n  export CUDY_PERMISSION_TEST_DIR=\"$(mktemp -d /tmp/cudy-permissions-XXXXXX)\" CUDY_PERMISSION_SOURCE=\"$PWD/old-source\" CUDY_PERMISSION_CASE=\"$case_name\"\n  if qemu-aarch64-static -L \"$root\" \"$root/usr/bin/lua\" tr3600/test-real-nixio.lua > \"reports/old-$case_name.log\" 2>&1; then\n    echo \"Old $case_name unexpectedly passed\"; exit 1\n  fi\n  grep -F \"bad argument #2 to 'chmod'\" \"reports/old-$case_name.log\"\ndone\nunset CUDY_PERMISSION_CASE\nset -Eeuo pipefail\nCUDY_PERMISSION_TEST_DIR=\"$(mktemp -d /tmp/cudy-permissions-XXXXXX)\"\nexport CUDY_PERMISSION_TEST_DIR CUDY_TEST_ROOT=\"$root\" CUDY_PERMISSION_SOURCE=\"$PWD/tr3600\"\nexport LUA_CPATH=\"$root/usr/lib/lua/?.so\" LUA_PATH=\"$root/usr/lib/lua/?.lua;$root/usr/lib/lua/?/init.lua\"\nqemu-aarch64-static -L \"$root\" \"$root/usr/bin/lua\" tr3600/test-real-nixio.lua\ntest \"$(stat -c %a \"$CUDY_PERMISSION_TEST_DIR/led\")\" = 700\ntest \"$(stat -c %a \"$CUDY_PERMISSION_TEST_DIR/led/sample.json\")\" = 600\ntest \"$(stat -c %a \"$CUDY_PERMISSION_TEST_DIR/wifi.json\")\" = 600\necho 'PASS actual ARM64 private directory/file permissions 700/600/600'\nlua5.1 tr3600/test-led-runtime.lua\nlua5.1 tr3600/test-wifi.lua\n"
        },
        {
          "name": "Upload permission regression reports",
          "if": "always()",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "tr3600-nixio-regression",
            "path": "reports/*.log",
            "if-no-files-found": "warn"
          }
        }
      ]
    }
  }
}
