{
  "name": "Cudy TR3600 v1 - Mango 20 test1",
  "on": {
    "push": {
      "branches": [
        "codex/cudy-tr3600-1f61697"
      ],
      "paths": [
        "tr3600/**",
        ".github/workflows/tr3600-test.yml"
      ]
    },
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read",
    "actions": "read"
  },
  "concurrency": {
    "group": "tr3600-${{ github.ref }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "build": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 330,
      "defaults": {
        "run": {
          "shell": "bash"
        }
      },
      "env": {
        "MANGO_BUILD_PROFILE": "standard"
      },
      "steps": [
        {
          "name": "Checkout build recipe",
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Extract reviewed build source bundle",
          "run": "python3 - <<'PY'\nimport base64, hashlib, io, zipfile\nfrom pathlib import Path, PurePosixPath\ndata=base64.b64decode(Path('release20-test-failover1-source.zip.b64').read_text().strip(),validate=True)\nassert hashlib.sha256(data).hexdigest()=='8dc17ef842929725b10a0152569a690c7ffe148473b1005cd7d610cda510e787'\nwith zipfile.ZipFile(io.BytesIO(data)) as z:\n    assert z.testzip() is None\n    names=z.namelist()\n    assert len(names)==len(set(names))\n    for name in names:\n        p=PurePosixPath(name)\n        assert not p.is_absolute() and '..' not in p.parts and chr(92) not in name\n    listed=[]\n    for row in z.read('SOURCE-FILES-SHA256SUMS').decode().splitlines():\n        expected,name=row.split('  ',1)\n        assert hashlib.sha256(z.read(name)).hexdigest()==expected,name\n        listed.append(name)\n    assert set(listed)==set(names)-{'SOURCE-FILES-SHA256SUMS'}\n    z.extractall()\nassert Path('files/etc/mango-release').read_text().strip()=='20-test-failover1'\nPY"
        },
        {
          "name": "Install build dependencies",
          "run": "sudo apt-get update\nsudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev libelf-dev python3 python3-setuptools python3-pyelftools rsync swig unzip zlib1g-dev file wget curl zstd xz-utils bzip2 ccache xsltproc lua5.1 nftables iproute2 iputils-ping qemu-user-static\nmkdir -p reports\ndf -h . | tee reports/disk-before.txt"
        },
        {
          "name": "Validate L2TP server configuration and encrypted input",
          "run": "sh tr3600/test-network.sh\npython3 tr3600/test-l2tp-config.py\nnode --check tr3600/luci-app-cudy-l2tp/htdocs/luci-static/resources/view/cudy-l2tp.js\nsh -n tr3600/luci-app-cudy-l2tp/root/etc/init.d/cudy_l2tp\nsh -n tr3600/luci-app-cudy-l2tp/root/etc/uci-defaults/94-cudy-l2tp\nsudo unshare --net python3 tr3600/test-l2tp-nft.py"
        },
        {
          "name": "Validate recipe",
          "run": "python3 -m unittest discover -s tests -v\nsh tests/test_switch_perf.sh .\nsh tests/test_probe_logging.sh .\nsh tests/test_watchdog_startup.sh .\nnode tests/test-ui.cjs\nnode tests/test-site-ui.cjs\nnode tests/subscription.cjs\nnode tests/test-update-progress.cjs\nbash -n scripts/prepare.sh scripts/validate-runtime.sh\nfor f in package/luci-app-mango-proxy/root/usr/libexec/mango-* package/luci-app-mango-proxy/root/usr/libexec/rpcd/mango package/luci-app-mango-proxy/root/etc/init.d/mango_* package/luci-app-mango-proxy/root/etc/uci-defaults/9*-mango-*; do if head -n1 \"$f\" | grep -q lua; then continue; fi; sh -n \"$f\"; done\nnode --check package/luci-app-mango-proxy/htdocs/luci-static/resources/view/mango-proxy.js\nnode --check package/luci-app-mango-proxy/htdocs/luci-static/resources/mango/subscription.js\nsh tests/test_cache_refresh.sh .\nsh tests/test_fw_reuse.sh package/luci-app-mango-proxy/root/etc/init.d/mango_proxy\nsh tests/test_recovery_trace.sh package/luci-app-mango-proxy/root/etc/init.d/mango_proxy package/luci-app-mango-proxy/root/usr/libexec/mango-failover\nsh tests/test_fw_installed.sh package/luci-app-mango-proxy/root/usr/libexec/mango-fw\nsh tests/test_recovery_policy.sh .\nsh tests/test_uplink.sh .\nsh tests/test_runtime_id.sh .\nsh tests/test_start_failure.sh .\npython3 scripts/loading-diagnostic/test-diagnostic.py\nsh tests/test_lifecycle_budget.sh .\nsh tests/test_apply_rollback.sh .\nsh tests/test_process_wait.sh package/luci-app-mango-proxy/root/usr/libexec/mango-process\nsh tests/test_preflight_phases.sh .\nsh tests/test_preflight_reuse.sh .\npython3 scripts/audit-installed-content.py files\npython3 scripts/audit-installed-content.py package/luci-app-mango-proxy/root"
        },
        {
          "name": "Adapt verified source for TR3600 v1",
          "run": "python3 tr3600/port.py\nbash -n tr3600/cudy-upgrade.sh\nbash tr3600/test-upgrade.sh"
        },
        {
          "name": "Validate routing policy and nftables",
          "run": "bash scripts/validate-runtime.sh 2>&1 | tee policy-tests.log"
        },
        {
          "name": "Prepare locked OpenWrt sources with TR3600 support",
          "run": "bash scripts/prepare.sh 2>&1 | tee prepare.log\npython3 tr3600/check-required.py"
        },
        {
          "name": "Download selected sources",
          "working-directory": "openwrt",
          "run": "make download -j4 2>&1 | tee ../download.log"
        },
        {
          "name": "Compile Cudy TR3600 v1 test firmware",
          "run": "make -j2 V=s 2>&1 | tee ../build.log",
          "id": "compile",
          "working-directory": "openwrt"
        },
        {
          "name": "Validate actual ARM64 Xray configuration",
          "run": "set -Eeuo pipefail\nbash scripts/validate-runtime.sh arm64 2>&1 | tee runtime-tests.log"
        },
        {
          "name": "Check actual ARM64 BusyBox syntax and installed content",
          "run": "set -Eeuo pipefail\nexec > >(tee reports/arm64-content-check.log) 2>&1\nset -x\nroots=(openwrt/build_dir/target-*/root-mediatek)\ntest \"${#roots[@]}\" = 1\nroot=\"$(realpath \"${roots[0]}\")\"\nfor path in usr/libexec/mango-recovery-guard etc/init.d/mango_proxy lib/upgrade/cudy-tr3600.sh etc/init.d/cudy_l2tp etc/uci-defaults/94-cudy-l2tp etc/hotplug.d/iface/95-cudy-tr3600-eee; do\n  qemu-aarch64-static -L \"$root\" \"$root/bin/busybox\" sh -n \"$root/$path\"\ndone\npython3 tr3600/test-ppp-ifname.py \"$root\"\npython3 scripts/audit-installed-content.py \"$root\" > reports/installed-content-audit.json\n"
        },
        {
          "name": "Verify packed TR3600 image and prepare checked assets",
          "run": "set -Eeuo pipefail\npython3 tr3600/verify.py 2>&1 | tee reports/final-image-check.log"
        },
        {
          "name": "Upload verified TR3600 test firmware",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "cudy-tr3600-v1-mango20-test1",
            "path": "tr3600-assets/",
            "retention-days": 90,
            "if-no-files-found": "error"
          }
        },
        {
          "name": "Preserve failed-check ARM64 root and packed verification inputs",
          "if": "failure() && steps.compile.outcome == 'success'",
          "run": "roots=(openwrt/build_dir/target-*/root-mediatek)\ntest \"${#roots[@]}\" = 1\ntar -C \"${roots[0]}\" -cJf reports/arm64-diagnostic-root.tar.xz .\npython3 tr3600/preserve-verification.py\n"
        },
        {
          "name": "Upload build diagnostics",
          "if": "always()",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "tr3600-diagnostics-${{ github.run_number }}",
            "path": "reports/*.json\nreports/*.config\nreports/*.txt\nprepare.log\ndownload.log\nbuild.log\npolicy-tests.log\nruntime-tests.log\nreports/*.log\nreports/arm64-diagnostic-root.tar.xz\nreports/packed-verification-inputs.tar.xz",
            "retention-days": 14,
            "if-no-files-found": "warn",
            "include-hidden-files": true
          }
        }
      ],
      "needs": "arm64-plugin-regression"
    },
    "arm64-plugin-regression": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 15,
      "steps": [
        {
          "name": "Checkout current verification script",
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Download previous successful ARM64 compilation for regression",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "gh run download 37193996628 --repo liuyong2027/mt300n-v2-openwrt --name tr3600-diagnostics-9 --dir previous-diagnostics\nmkdir -p previous-arm64-root reports\ntar -xJf previous-diagnostics/reports/arm64-diagnostic-root.tar.xz -C previous-arm64-root\nsudo apt-get update\nsudo apt-get install -y qemu-user-static\n"
        },
        {
          "name": "Verify actual ARM64 concurrent PPP plugin with explicit stderr logging",
          "run": "set -Eeuo pipefail\npython3 tr3600/test-ppp-ifname.py \"$(realpath previous-arm64-root)\" 2>&1 | tee reports/previous-arm64-plugin-check.log"
        },
        {
          "name": "Preserve focused regression log",
          "if": "always()",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "tr3600-arm64-plugin-regression-${{ github.run_number }}",
            "path": "reports/previous-arm64-plugin-check.log",
            "retention-days": 14,
            "if-no-files-found": "warn"
          }
        }
      ]
    }
  }
}
