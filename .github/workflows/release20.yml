{
  "name": "Release 20 publication held for profile separation",
  "on": {
    "push": {
      "branches": [
        "main"
      ],
      "paths": [
        ".github/workflows/release20.yml"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "release20-formal",
    "cancel-in-progress": true
  },
  "jobs": {
    "hold": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 5,
      "steps": [
        {
          "name": "Hold publication",
          "run": "printf '%s\\n' 'Publication is on hold while production and diagnostic profiles are separated and verified. No firmware is published by this workflow.'"
        }
      ]
    }
  }
}
