{
  "name": "TR3600 WebFiles upgrade storage mode regression",
  "on": {
    "push": {
      "branches": [
        "codex/tr3600-webfiles-upgrade-storage-mode"
      ],
      "paths": [
        "tr3600/cudy-webfiles/**",
        "tr3600/test-webfiles-storage.lua",
        ".github/workflows/tr3600-webfiles-storage.yml",
        "release/tr3600-webfiles-storage/**"
      ]
    },
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "tr3600-webfiles-storage-${{ github.ref }}",
    "cancel-in-progress": false
  },
  "jobs": {
    "verify": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 15,
      "steps": [
        {
          "name": "Checkout reviewed storage-mode fix",
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Reproduce archive restore and verify real ARM64 nixio behavior",
          "env": {
            "GH_TOKEN": "${{ secrets.GITHUB_TOKEN }}"
          },
          "run": "set -Eeuo pipefail\nsudo apt-get update\nsudo apt-get install -y qemu-user-static squashfs-tools\nmkdir -p reference proof\ngh release download tr3600-v1.1.0-rc2 --repo liuyong2027/mt300n-v2-openwrt --pattern cudy-tr3600-v1-1.1.0-rc2-sysupgrade.bin --dir reference\necho 'aabd2ed69c74d1ed4001811a4e7ec64dae84c1e8864888c292e489bde5e9f382  reference/cudy-tr3600-v1-1.1.0-rc2-sysupgrade.bin' | sha256sum -c -\ntar -xf reference/cudy-tr3600-v1-1.1.0-rc2-sysupgrade.bin -C reference\npayloads=(reference/sysupgrade-*/root)\ntest \"${#payloads[@]}\" = 1\nsudo unsquashfs -d reference/rootfs \"${payloads[0]}\" > proof/extract.log\nimage_root=\"$PWD/reference/rootfs\"\ntest_root=$(sudo mktemp -d /tmp/cudy-webfiles-storage-test.XXXXXX)\ntrap 'sudo rm -rf -- \"$test_root\"' EXIT\nsudo env LUA_CPATH=\"$image_root/usr/lib/lua/?.so\" LUA_PATH=\"$image_root/usr/lib/lua/?.lua;$image_root/usr/lib/lua/?/init.lua\" qemu-aarch64-static -L \"$image_root\" \"$image_root/usr/bin/lua\" tr3600/test-webfiles-storage.lua \"$test_root\" \"$PWD/tr3600/cudy-webfiles/root/usr/lib/lua/cudy/webfiles-storage.lua\" | tee proof/storage-regressions.txt\ngrep -Fx 'PASS all11 native storage restoration regressions' proof/storage-regressions.txt\nbash -n tr3600/cudy-webfiles/root/etc/init.d/cudy-webfiles tr3600/cudy-webfiles/root/etc/uci-defaults/98-cudy-webfiles\npython3 - <<'PY'\nimport hashlib,json,os\nfrom pathlib import Path\nroot=Path('tr3600/cudy-webfiles/root')\ncall='/usr/bin/lua /usr/lib/cudy-webfiles/prepare-storage.lua || '\ninit=(root/'etc/init.d/cudy-webfiles').read_text()\nboot=(root/'etc/uci-defaults/98-cudy-webfiles').read_text()\nassert init.index(call+'return 1') < init.index('\"$helper\" reset')\nassert boot.index(call+'exit 1') < boot.index('/etc/init.d/cudy-webfiles enable')\nassert (root/'usr/lib/cudy-webfiles/prepare-storage.lua').read_text().count(\"prepare('/etc/cudy-webfiles', 0)\")==1\nfiles=sorted([p for p in root.rglob('*') if p.is_file()]+[Path('tr3600/test-webfiles-storage.lua'),Path('tr3600/cudy-webfiles/Makefile')])\nproof={'source_commit':os.environ['GITHUB_SHA'],'reference_image_sha256':'aabd2ed69c74d1ed4001811a4e7ec64dae84c1e8864888c292e489bde5e9f382','runtime':'Actual ARM64 Lua/nixio extracted from published rc2 under QEMU, root fixtures','storage_regressions_passed':11,'real_account_or_certificate_data_used':False,'full_firmware_rebuilt':False,'hardware_boot_of_new_firmware_tested':False,'files':{str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in files}}\nPath('proof/storage-verification.json').write_text(json.dumps(proof,indent=2)+'\\n')\nPY\n"
        },
        {
          "name": "Preserve regression evidence",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "tr3600-webfiles-storage-${{ github.sha }}",
            "path": "proof/",
            "if-no-files-found": "error",
            "retention-days": 90
          }
        }
      ]
    },
    "disclose-rc2-defect": {
      "needs": [
        "verify"
      ],
      "if": "github.repository == 'liuyong2027/mt300n-v2-openwrt' && github.ref == 'refs/heads/codex/tr3600-webfiles-upgrade-storage-mode'",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 5,
      "permissions": {
        "contents": "write"
      },
      "steps": [
        {
          "name": "Checkout reviewed storage-mode fix",
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Describe verified upgrade issue without replacing rc2 assets",
          "env": {
            "GH_TOKEN": "${{ secrets.GITHUB_TOKEN }}"
          },
          "run": "python3 release/tr3600-webfiles-storage/annotate.py"
        }
      ]
    }
  }
}
